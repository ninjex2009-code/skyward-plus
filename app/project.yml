name: SkywardPlus
options:
  bundleIdPrefix: com.skywardplus
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.6.1"
    CURRENT_PROJECT_VERSION: "17"
targets:
  SkywardPlus:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: SkywardPlusWidget/WidgetSnapshot.swift
      - path: SkywardPlus
        excludes:
          - "**/.impeccable"
          - "**/.impeccable/**"
          - "**/*.json.cache"
    info:
      path: SkywardPlus/Resources/Info.plist
      properties:
        CFBundleDisplayName: Skyward Plus
        CFBundleName: Skyward Plus
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.education
        NSFaceIDUsageDescription: Skyward Plus uses Face ID to keep your grades private.
        NSRemindersFullAccessUsageDescription: Skyward Plus adds your due dates to a Skyward Plus list in Reminders.
        NSCalendarsFullAccessUsageDescription: Skyward Plus adds your due dates to a Skyward Plus calendar.
        NSRemindersUsageDescription: Skyward Plus adds your due dates to a Skyward Plus list in Reminders.
        NSCalendarsUsageDescription: Skyward Plus adds your due dates to a Skyward Plus calendar.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        BGTaskSchedulerPermittedIdentifiers:
          - com.skywardplus.app.refresh
        UIBackgroundModes:
          - fetch
        CFBundleURLTypes:
          - CFBundleURLName: com.skywardplus.app
            CFBundleURLSchemes: [skywardplus]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skywardplus.app
        PRODUCT_NAME: Skyward Plus
        PRODUCT_MODULE_NAME: SkywardPlus
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        "CODE_SIGN_ENTITLEMENTS[sdk=iphone*]": SkywardPlus/Resources/SkywardPlus-iOS.entitlements
        SP_APP_GROUP: group.com.skywardplus.app
      configs:
        # Test builds get their own identity so they never touch the installed app.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.skywardplus.app.debug
          SP_APP_GROUP: group.com.skywardplus.app.debug
    dependencies:
      - target: SkywardPlusWidget
        embed: true
        destinationFilters: [macOS]
      - target: SkywardPlusWidgetiOS
        embed: true
        destinationFilters: [iOS]
    scheme:
      testTargets:
        - SkywardPlusTests
  SkywardPlusWidget:
    type: app-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: SkywardPlusWidget
        excludes:
          - "*.entitlements"
    info:
      path: SkywardPlusWidget/Info.plist
      properties:
        CFBundleDisplayName: Skyward Plus
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skywardplus.app.widget
        PRODUCT_NAME: SkywardPlusWidget
        CODE_SIGN_ENTITLEMENTS: SkywardPlusWidget/SkywardPlusWidget.entitlements
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        SKIP_INSTALL: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.skywardplus.app.debug.widget
  SkywardPlusWidgetiOS:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SkywardPlusWidget
        excludes:
          - "*.entitlements"
          - "Info.plist"
    info:
      path: SkywardPlusWidget/Info-iOS.plist
      properties:
        CFBundleDisplayName: Skyward Plus
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skywardplus.app.widget
        PRODUCT_NAME: SkywardPlusWidgetiOS
        PRODUCT_MODULE_NAME: SkywardPlusWidget
        CODE_SIGN_ENTITLEMENTS: SkywardPlusWidget/SkywardPlusWidget-iOS.entitlements
        CODE_SIGN_STYLE: Automatic
        SP_APP_GROUP: group.com.skywardplus.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        SKIP_INSTALL: YES
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.skywardplus.app.debug.widget
          SP_APP_GROUP: group.com.skywardplus.app.debug
  SkywardPlusTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: SkywardPlusTests
      - path: SkywardPlus/Core
        excludes:
          - "**/.impeccable"
          - "**/.impeccable/**"
          - "**/*.json.cache"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skywardplus.tests
        GENERATE_INFOPLIST_FILE: YES
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
schemes:
  CoreTests:
    build:
      targets:
        SkywardPlusTests: [test]
    test:
      targets:
        - SkywardPlusTests
