<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Skyward+</title>
  <link rel="stylesheet" href="../src/ui/app.css">
  <style>
    html, body { margin: 0; width: 320px; }
    .sp-app { height: auto; padding: 14px; gap: 12px; }
    .sp-pop-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .sp-pop-list { max-height: 260px; overflow-y: auto; margin: 4px -4px; }
    .sp-pop-row { display: flex; align-items: center; gap: 8px; padding: 7px 4px; border-radius: 8px; cursor: pointer; }
    .sp-pop-row:hover { background: var(--surface-3); }
    .sp-pop-row .grow { flex: 1; min-width: 0; }
    .sp-pop-row b { display: block; font-size: 12.5px; font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sp-pop-row span { font-size: 11px; color: var(--text-faint); }
    .sp-pop-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .sp-pop-actions .sp-btn { justify-content: center; }
  </style>
</head>
<body>
  <div class="sp-app" id="pop" data-theme="dark"></div>
  <script src="../src/lib/util.js"></script>
  <script src="../src/lib/model.js"></script>
  <script src="../src/lib/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
